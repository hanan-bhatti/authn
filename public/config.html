<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Configuration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #e9ecef;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-sm: 6px;
            --radius: 8px;
            --radius-lg: 12px;
            --spacing-sm: 6px;
            --spacing-md: 8px;
            --spacing-lg: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --bg-tertiary: #3d3d3d;
                --text-primary: #ffffff;
                --text-secondary: #9ca3af;
                --border: #404040;
            }
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3d3d3d;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --border: #404040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-lg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .warning {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--warning), #fb923c);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-lg);
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        .theme-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-primary);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-md);
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation-fill-mode: both;
            border: 1px solid var(--border);
            border-top: 3px solid transparent;
            background-image: linear-gradient(var(--bg-secondary), var(--bg-secondary)),
                              linear-gradient(135deg, var(--primary), var(--secondary));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.15s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.25s; }
        .card:nth-child(5) { animation-delay: 0.3s; }
        .card:nth-child(6) { animation-delay: 0.35s; }
        .card:nth-child(7) { animation-delay: 0.4s; }
        .card:nth-child(8) { animation-delay: 0.45s; }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.02em;
        }

        .icon-badge {
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }

        .config-item:last-child {
            border-bottom: none;
        }

        .config-label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            min-width: 120px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .config-label i {
            font-size: 10px;
            opacity: 0.6;
        }

        .config-value {
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            text-align: right;
            word-break: break-word;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            background: var(--bg-primary);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            max-width: 60%;
        }

        .config-value.boolean-true {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border: none;
        }

        .config-value.boolean-false {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: none;
        }

        .config-value.null {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-style: italic;
            border: none;
        }

        .back-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50%;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            font-size: 24px;
            color: white;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .back-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .loading {
            text-align: center;
            color: var(--text-primary);
            padding: 60px 20px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 4px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-state {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 40px;
            text-align: center;
            border: 2px solid var(--danger);
        }

        .error-state i {
            font-size: 48px;
            color: var(--danger);
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .error-message {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .refresh-notice {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 30px;
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.5s both;
        }

        .refresh-notice i {
            animation: pulse 2s ease-in-out infinite;
        }

        .kbd {
            display: inline-block;
            padding: 2px 6px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 1px 0 var(--border);
            margin: 0 2px;
        }

        @media (max-width: 768px) {
            .theme-toggle {
                top: 20px;
                right: 20px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }

            .card {
                padding: 20px;
            }

            .config-value {
                max-width: 55%;
            }

            .back-btn {
                bottom: 20px;
                right: 20px;
                width: 56px;
                height: 56px;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 20px 12px;
            }

            h1 {
                font-size: 28px;
            }

            .config-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .config-value {
                max-width: 100%;
                text-align: left;
            }
        }

        @media print {
            .theme-toggle,
            .back-btn,
            .refresh-notice,
            .warning {
                display: none !important;
            }

            body {
                background: white;
                color: black;
            }

            .card {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme (D)">
        <i class="fas fa-moon"></i>
    </button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading configuration...</p>
    </div>

    <div class="container" id="content" style="display: none;"></div>

    <a href="/info" class="back-btn" title="Back to Info (I)">
        <i class="fas fa-arrow-left"></i>
    </a>

    <script>
        // Theme Management
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme');
        
        if (savedTheme) {
            html.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            const icon = themeToggle.querySelector('i');
            icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            switch(e.key.toLowerCase()) {
                case 'r':
                    loadConfig();
                    break;
                case 'i':
                    window.location.href = '/info';
                    break;
                case 'h':
                    window.location.href = '/health';
                    break;
                case 'd':
                    themeToggle.click();
                    break;
            }
        });

        // Icon mapping for sections
        const sectionIcons = {
            'Application': 'fa-box',
            'Environment': 'fa-earth-americas',
            'URLs': 'fa-link',
            'API Configuration': 'fa-bolt',
            'Development': 'fa-code',
            'Localization': 'fa-globe',
            'Security': 'fa-shield-halved',
            'Features': 'fa-sparkles'
        };

        async function loadConfig() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');

            try {
                let response;
                try {
                    response = await fetch('/api/v1/info/config');
                    if (!response.ok) throw new Error('Versioned API not found');
                } catch (e) {
                    response = await fetch('/api/info/config');
                }

                const result = await response.json();
                const config = result.data;

                loading.style.display = 'none';
                content.style.display = 'block';

                const sections = [
                    { title: 'Application', data: config.app },
                    { title: 'Environment', data: config.environment },
                    { title: 'URLs', data: config.urls },
                    { title: 'API Configuration', data: config.api },
                    { title: 'Development', data: config.development },
                    { title: 'Localization', data: config.localization },
                    { title: 'Security', data: config.security },
                    { title: 'Features', data: config.features }
                ];

                content.innerHTML = `
                    <div class="header">
                        <h1>
                            <span class="header-icon">
                                <i class="fas fa-gear"></i>
                            </span>
                            Server Configuration
                        </h1>
                        <div class="warning">
                            <i class="fas fa-shield-halved"></i>
                            Development Mode Only - Contains sensitive information
                        </div>
                    </div>
                    <div class="grid">
                        ${sections.map(section => `
                            <div class="card">
                                <div class="card-title">
                                    <div class="icon-badge">
                                        <i class="fas ${sectionIcons[section.title] || 'fa-cog'}"></i>
                                    </div>
                                    ${section.title}
                                </div>
                                ${Object.entries(section.data || {}).map(([key, value]) => {
                                    const valueClass = getValueClass(value);
                                    return `
                                        <div class="config-item">
                                            <span class="config-label">
                                                <i class="fas fa-circle"></i>
                                                ${formatKey(key)}
                                            </span>
                                            <span class="config-value ${valueClass}">${formatValue(value)}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `).join('')}
                    </div>
                    <div class="refresh-notice">
                        <i class="fas fa-info-circle"></i> 
                        Auto-refresh in 30s | Press <span class="kbd">R</span> to refresh, 
                        <span class="kbd">I</span> for info, <span class="kbd">H</span> for health, 
                        <span class="kbd">D</span> for dark mode
                    </div>
                `;

            } catch (error) {
                loading.style.display = 'none';
                content.style.display = 'block';
                content.innerHTML = `
                    <div class="header">
                        <div class="error-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <div class="error-title">Failed to Load Configuration</div>
                            <div class="error-message">${error.message || 'Failed to load configuration'}</div>
                        </div>
                    </div>
                `;
            }
        }

        function formatKey(key) {
            return key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()).trim();
        }

        function getValueClass(value) {
            if (value === null || value === undefined) return 'null';
            if (typeof value === 'boolean') return value ? 'boolean-true' : 'boolean-false';
            return '';
        }

        function formatValue(value) {
            if (value === null || value === undefined) return 'null';
            if (typeof value === 'boolean') return value ? 'true' : 'false';
            if (Array.isArray(value)) return value.join(', ');
            if (typeof value === 'object') return JSON.stringify(value);
            return String(value);
        }

        // Auto-refresh every 30 seconds
        let refreshInterval;
        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                loadConfig();
            }, 30000);
        }

        // Initial load
        loadConfig().then(() => startAutoRefresh());

        // Stop auto-refresh when page is hidden
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(refreshInterval);
            } else {
                startAutoRefresh();
            }
        });
    </script>
</body>
</html>
