<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Index</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #e9ecef;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-sm: 6px;
            --radius: 8px;
            --radius-lg: 12px;
            --spacing-sm: 6px;
            --spacing-md: 8px;
            --spacing-lg: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --bg-tertiary: #3d3d3d;
                --text-primary: #ffffff;
                --text-secondary: #9ca3af;
                --border: #404040;
            }
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3d3d3d;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --border: #404040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-lg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .theme-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-primary);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-md);
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .doc-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: var(--shadow-lg);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation-fill-mode: both;
            text-decoration: none;
            display: block;
            border: 1px solid var(--border);
            border-top: 3px solid transparent;
            background-image: linear-gradient(var(--bg-secondary), var(--bg-secondary)),
                              linear-gradient(135deg, var(--primary), var(--secondary));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            position: relative;
            overflow: hidden;
        }

        .doc-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
        }

        .doc-card:hover::before {
            opacity: 0.05;
        }

        .doc-card > * {
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .doc-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
        }

        .doc-icon-wrapper {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: var(--shadow-md);
        }

        .doc-icon {
            font-size: 32px;
            color: white;
        }

        .doc-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .doc-location {
            display: inline-block;
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .doc-url {
            font-size: 13px;
            color: var(--primary);
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .doc-url i {
            font-size: 10px;
            opacity: 0.6;
        }

        .section-title {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 700;
            margin: 40px 0 20px;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 24px 36px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            flex: 1;
            min-width: 160px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
            font-weight: 600;
        }

        .back-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50%;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            font-size: 24px;
            color: white;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .back-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .loading {
            text-align: center;
            color: var(--text-primary);
            padding: 60px 20px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 4px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .error-state {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 40px;
            text-align: center;
            border: 2px solid var(--danger);
        }

        .error-state i {
            font-size: 48px;
            color: var(--danger);
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .error-message {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .refresh-notice {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 30px;
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.5s both;
        }

        .refresh-notice i {
            animation: pulse 2s ease-in-out infinite;
        }

        .kbd {
            display: inline-block;
            padding: 2px 6px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 1px 0 var(--border);
            margin: 0 2px;
        }

        @media (max-width: 768px) {
            .theme-toggle {
                top: 20px;
                right: 20px;
            }

            h1 {
                font-size: 32px;
            }

            .docs-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
            }

            .back-btn {
                bottom: 20px;
                right: 20px;
                width: 56px;
                height: 56px;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 20px 12px;
            }

            h1 {
                font-size: 28px;
            }

            .section-title {
                font-size: 20px;
            }

            .doc-card {
                padding: 20px;
            }
        }

        @media print {
            .theme-toggle,
            .back-btn,
            .refresh-notice {
                display: none !important;
            }

            body {
                background: white;
                color: black;
            }

            .doc-card {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme (D)">
        <i class="fas fa-moon"></i>
    </button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading documentation index...</p>
    </div>

    <div class="container" id="content" style="display: none;"></div>

    <a href="/info" class="back-btn" title="Back to Info (I)">
        <i class="fas fa-arrow-left"></i>
    </a>

    <script>
        // Theme Management
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme');
        
        if (savedTheme) {
            html.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            const icon = themeToggle.querySelector('i');
            icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            switch(e.key.toLowerCase()) {
                case 'r':
                    loadDocs();
                    break;
                case 'i':
                    window.location.href = '/info';
                    break;
                case 'h':
                    window.location.href = '/health';
                    break;
                case 'd':
                    themeToggle.click();
                    break;
            }
        });

        // Icon mapping for document types
        const iconMap = {
            api: 'fa-book',
            documentation: 'fa-book-open',
            faq: 'fa-circle-question',
            deployment: 'fa-rocket',
            readme: 'fa-file-lines',
            features: 'fa-sparkles',
            security: 'fa-shield-halved',
            changelog: 'fa-list-check',
            guide: 'fa-map',
            tutorial: 'fa-graduation-cap',
            reference: 'fa-bookmark',
            default: 'fa-file-alt'
        };

        function getIcon(name) {
            const lowerName = name.toLowerCase();
            for (const [key, icon] of Object.entries(iconMap)) {
                if (lowerName.includes(key)) return icon;
            }
            return iconMap.default;
        }

        async function loadDocs() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');

            try {
                let response;
                try {
                    response = await fetch('/api/v1/docs/list', {
                        headers: { 'Accept': 'application/json' }
                    });
                    if (!response.ok) throw new Error('Versioned API not found');
                } catch (e) {
                    response = await fetch('/api/docs/list', {
                        headers: { 'Accept': 'application/json' }
                    });
                }

                const result = await response.json();
                const data = result.data || result;
                const docs = data.docs || [];
                const count = data.count || docs.length;

                loading.style.display = 'none';
                content.style.display = 'block';

                // Group by location
                const docsByLocation = {
                    docs: docs.filter(d => d.location === 'docs'),
                    root: docs.filter(d => d.location === 'root')
                };

                content.innerHTML = `
                    <div class="header">
                        <h1>
                            <span class="header-icon">
                                <i class="fas fa-book"></i>
                            </span>
                            Documentation Index
                        </h1>
                        <p class="subtitle">Browse all available documentation</p>
                    </div>

                    ${docsByLocation.docs.length > 0 ? `
                        <div class="section-title">Documentation Pages</div>
                        <div class="docs-grid">
                            ${docsByLocation.docs.map((doc, i) => `
                                <a href="${doc.url}" class="doc-card" style="animation-delay: ${i * 0.1}s">
                                    <div class="doc-icon-wrapper">
                                        <i class="fas ${getIcon(doc.name)} doc-icon"></i>
                                    </div>
                                    <div class="doc-location">${doc.location}</div>
                                    <div class="doc-title">${doc.title}</div>
                                    <div class="doc-url">
                                        <i class="fas fa-link"></i>
                                        ${doc.url}
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    ` : ''}

                    ${docsByLocation.root.length > 0 ? `
                        <div class="section-title">Project Information</div>
                        <div class="docs-grid">
                            ${docsByLocation.root.map((doc, i) => `
                                <a href="${doc.url}" class="doc-card" style="animation-delay: ${(docsByLocation.docs.length + i) * 0.1}s">
                                    <div class="doc-icon-wrapper">
                                        <i class="fas ${getIcon(doc.name)} doc-icon"></i>
                                    </div>
                                    <div class="doc-location">${doc.location}</div>
                                    <div class="doc-title">${doc.title}</div>
                                    <div class="doc-url">
                                        <i class="fas fa-link"></i>
                                        ${doc.url}
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    ` : ''}

                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-number">${count}</div>
                            <div class="stat-label">Total Documents</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${docsByLocation.docs.length}</div>
                            <div class="stat-label">Doc Pages</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${docsByLocation.root.length}</div>
                            <div class="stat-label">Project Files</div>
                        </div>
                    </div>

                    <div class="refresh-notice">
                        <i class="fas fa-info-circle"></i> 
                        Auto-refresh in 30s | Press <span class="kbd">R</span> to refresh, 
                        <span class="kbd">I</span> for info, <span class="kbd">H</span> for health, 
                        <span class="kbd">D</span> for dark mode
                    </div>
                `;

            } catch (error) {
                loading.style.display = 'none';
                content.style.display = 'block';
                content.innerHTML = `
                    <div class="header">
                        <div class="error-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <div class="error-title">Failed to Load Documentation</div>
                            <div class="error-message">${error.message}</div>
                        </div>
                    </div>
                `;
            }
        }

        // Auto-refresh every 30 seconds
        let refreshInterval;
        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                loadDocs();
            }, 30000);
        }

        // Initial load
        loadDocs().then(() => startAutoRefresh());

        // Stop auto-refresh when page is hidden
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(refreshInterval);
            } else {
                startAutoRefresh();
            }
        });
    </script>
</body>
</html>
