<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Check</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-elevated: #ffffff;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            
            --border-color: #e2e8f0;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            
            --radius-sm: 6px;
            --radius: 8px;
            --radius-lg: 12px;
            
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0f172a;
                --bg-secondary: #1e293b;
                --bg-tertiary: #334155;
                --bg-elevated: #1e293b;
                
                --text-primary: #f1f5f9;
                --text-secondary: #cbd5e1;
                --text-tertiary: #64748b;
                
                --border-color: #334155;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            background: var(--bg-elevated);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 600px;
            width: 100%;
            padding: 48px 40px;
            animation: slideUp 0.5s ease-out;
            border: 1px solid var(--border-color);
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 1rem;
            z-index: 10;
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
            transform: scale(1.05);
        }

        .status-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            animation: pulse 2s ease-in-out infinite;
            position: relative;
        }

        .status-icon.healthy {
            background: linear-gradient(135deg, var(--success), #059669);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .status-icon.error {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        .status-icon::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            opacity: 0.3;
            animation: ripple 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .status-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 32px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .status-badge.healthy {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-badge.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .metrics {
            display: grid;
            gap: 12px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            transition: var(--transition);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .metric::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .metric:hover::before {
            transform: scaleX(1);
        }

        .metric:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }

        .metric-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .metric-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
        }

        .metric-value {
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 700;
            font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg-tertiary);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timestamp {
            text-align: center;
            margin-top: 24px;
            color: var(--text-tertiary);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            transform: translateY(-2px);
            border-color: var(--primary);
            color: var(--primary);
        }

        .error {
            text-align: center;
            color: var(--danger);
            padding: 32px 20px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: var(--radius);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .error i {
            font-size: 2.5rem;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .error h3 {
            margin-bottom: 8px;
            font-size: 1.25rem;
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 24px 0;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
        }

        .footer-link:hover {
            color: var(--primary);
            background: var(--bg-secondary);
        }

        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .status-icon {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }

            .actions {
                flex-direction: column;
            }

            .metric-icon {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
            }

            .container {
                box-shadow: none;
                border: 1px solid #ddd;
            }

            .theme-toggle, .actions {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle dark mode">
            <i class="fas fa-moon"></i>
        </button>

        <div class="status-icon healthy" id="statusIcon">
            <i class="fas fa-check"></i>
        </div>
        
        <h1 id="statusTitle">System Healthy</h1>
        <div class="status-badge healthy" id="statusBadge">
            <span class="status-indicator"></span>
            <span>All Systems Operational</span>
        </div>
        
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading health data...</p>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="loadHealth()">
                <i class="fas fa-sync-alt"></i>
                Refresh Status
            </button>
            <a href="/info" class="btn btn-secondary">
                <i class="fas fa-info-circle"></i>
                Server Info
            </a>
        </div>

        <div class="divider"></div>

        <div class="footer-links">
            <a href="/" class="footer-link">
                <i class="fas fa-home"></i>
                Home
            </a>
            <a href="/api/docs" class="footer-link">
                <i class="fas fa-book"></i>
                Documentation
            </a>
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        // Theme toggle functionality
        function toggleTheme() {
            const root = document.documentElement;
            const btn = document.querySelector('.theme-toggle i');
            const currentTheme = localStorage.getItem('theme') || 'auto';
            
            if (currentTheme === 'dark') {
                localStorage.setItem('theme', 'light');
                root.style.colorScheme = 'light';
                btn.className = 'fas fa-moon';
            } else {
                localStorage.setItem('theme', 'dark');
                root.style.colorScheme = 'dark';
                btn.className = 'fas fa-sun';
            }
        }

        // Load saved theme
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const btn = document.querySelector('.theme-toggle i');
            if (savedTheme) {
                document.documentElement.style.colorScheme = savedTheme;
                if (savedTheme === 'dark') {
                    btn.className = 'fas fa-sun';
                }
            }
        })();

        async function loadHealth() {
            const content = document.getElementById('content');
            const statusIcon = document.getElementById('statusIcon');
            const statusTitle = document.getElementById('statusTitle');
            const statusBadge = document.getElementById('statusBadge');
            const timestamp = document.getElementById('timestamp');

            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading health data...</p></div>';

            try {
                // Try versioned API first, fallback to non-versioned
                let response;
                try {
                    response = await fetch('/api/v1/info/health');
                    if (!response.ok) throw new Error('Versioned API not found');
                } catch (e) {
                    response = await fetch('/api/info/health');
                }
                
                const result = await response.json();
                const health = result.data;

                // Update status
                statusIcon.className = 'status-icon healthy';
                statusIcon.innerHTML = '<i class="fas fa-check"></i>';
                statusTitle.textContent = 'System Healthy';
                statusBadge.className = 'status-badge healthy';
                statusBadge.innerHTML = '<span class="status-indicator"></span><span>' + health.status.toUpperCase() + '</span>';

                // Build metrics with icons
                const metrics = [
                    { label: 'Status', value: health.status, icon: 'fa-circle-check' },
                    { label: 'Uptime', value: health.uptime.formatted, icon: 'fa-clock' },
                    { label: 'Environment', value: health.environment, icon: 'fa-server' },
                    { label: 'Node Version', value: health.nodeVersion, icon: 'fa-node-js' },
                    { label: 'Heap Used', value: health.memory.heapUsed, icon: 'fa-memory' },
                    { label: 'Heap Total', value: health.memory.heapTotal, icon: 'fa-microchip' },
                    { label: 'RSS Memory', value: health.memory.rss, icon: 'fa-database' }
                ];

                content.innerHTML = `
                    <div class="metrics">
                        ${metrics.map(m => `
                            <div class="metric">
                                <div class="metric-left">
                                    <div class="metric-icon">
                                        <i class="fas ${m.icon}"></i>
                                    </div>
                                    <span class="metric-label">${m.label}</span>
                                </div>
                                <span class="metric-value">${m.value}</span>
                            </div>
                        `).join('')}
                    </div>
                `;

                timestamp.innerHTML = `
                    <i class="fas fa-clock"></i>
                    <span>Last checked: ${new Date(health.timestamp).toLocaleString()}</span>
                `;

            } catch (error) {
                statusIcon.className = 'status-icon error';
                statusIcon.innerHTML = '<i class="fas fa-times"></i>';
                statusTitle.textContent = 'Health Check Failed';
                statusBadge.className = 'status-badge error';
                statusBadge.innerHTML = '<span class="status-indicator"></span><span>Error</span>';
                
                content.innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Failed to Load Health Data</h3>
                        <p>${error.message}</p>
                    </div>
                `;
                
                timestamp.innerHTML = `
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Check failed at ${new Date().toLocaleString()}</span>
                `;
            }
        }

        // Load on page load
        loadHealth();

        // Auto-refresh every 30 seconds
        setInterval(loadHealth, 30000);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Press 'r' to refresh
            if (e.key === 'r' && !e.ctrlKey && !e.metaKey) {
                loadHealth();
            }
            // Press 'i' for info
            if (e.key === 'i' && !e.ctrlKey && !e.metaKey) {
                window.location.href = '/info';
            }
        });
    </script>
</body>
</html>
