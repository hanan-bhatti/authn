<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Status</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-elevated: #ffffff;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            
            --border-color: #e2e8f0;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            
            --radius-sm: 6px;
            --radius: 8px;
            --radius-lg: 12px;
            
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0f172a;
                --bg-secondary: #1e293b;
                --bg-tertiary: #334155;
                --bg-elevated: #1e293b;
                
                --text-primary: #f1f5f9;
                --text-secondary: #cbd5e1;
                --text-tertiary: #64748b;
                
                --border-color: #334155;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            background: var(--bg-elevated);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 700px;
            width: 100%;
            padding: 48px 40px;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
            border: 1px solid var(--border-color);
            position: relative;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 1rem;
            z-index: 10;
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
            transform: scale(1.05);
        }

        .status-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            box-shadow: var(--shadow-lg);
            animation: pulse 2s ease-in-out infinite;
            position: relative;
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: var(--shadow-lg);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 25px 35px -5px rgb(0 0 0 / 0.2);
            }
        }

        .status-icon::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            opacity: 0.3;
            animation: ripple 2s ease-in-out infinite;
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        h1 {
            color: var(--text-primary);
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: var(--radius);
            transition: var(--transition);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .stat-card:hover::before {
            transform: scaleX(1);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .stat-label {
            color: var(--text-tertiary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }

        .status-indicator.online {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .status-indicator.offline {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            transform: translateY(-2px);
            border-color: var(--primary);
            color: var(--primary);
        }

        .links {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
        }

        .links-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-tertiary);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .link-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
        }

        .link-item {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-item i {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .link-item:hover {
            background: var(--bg-tertiary);
            color: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .loading-skeleton {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--bg-tertiary);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-state {
            grid-column: 1 / -1;
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
        }

        .error-state .stat-value {
            color: var(--danger);
        }

        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }

            .link-list {
                grid-template-columns: 1fr;
            }

            .status-icon {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }
        }

        /* Loading shimmer effect */
        @keyframes shimmer {
            0% { background-position: -468px 0; }
            100% { background-position: 468px 0; }
        }

        .skeleton {
            background: linear-gradient(to right, var(--bg-secondary) 8%, var(--bg-tertiary) 18%, var(--bg-secondary) 33%);
            background-size: 800px 100px;
            animation: shimmer 2s infinite;
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
            }

            .container {
                box-shadow: none;
                border: 1px solid #ddd;
            }

            .theme-toggle, .btn-group, .links {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle dark mode">
            <i class="fas fa-moon"></i>
        </button>

        <div class="status-icon">
            <i class="fas fa-rocket"></i>
        </div>
        
        <h1 id="appName">Server Running</h1>
        <p class="subtitle" id="appDescription">Authentication & User Management System</p>

        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-label">
                    <i class="fas fa-circle"></i>
                    Status
                </div>
                <div class="stat-value">
                    <div class="loading-skeleton"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">
                    <i class="fas fa-tag"></i>
                    Version
                </div>
                <div class="stat-value">
                    <div class="loading-skeleton"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">
                    <i class="fas fa-server"></i>
                    Environment
                </div>
                <div class="stat-value">
                    <div class="loading-skeleton"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">
                    <i class="fas fa-cloud"></i>
                    Deployment
                </div>
                <div class="stat-value">
                    <div class="loading-skeleton"></div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <a href="/info" class="btn btn-primary">
                <i class="fas fa-info-circle"></i>
                View Details
            </a>
            <a href="/health" class="btn btn-secondary">
                <i class="fas fa-heartbeat"></i>
                Health Check
            </a>
        </div>

        <div class="links">
            <div class="links-header">
                <i class="fas fa-link"></i> Quick Links
            </div>
            <div class="link-list">
                <a href="/login" class="link-item">
                    <i class="fas fa-sign-in-alt"></i>
                    Login
                </a>
                <a href="/register" class="link-item">
                    <i class="fas fa-user-plus"></i>
                    Register
                </a>
                <a href="/dashboard" class="link-item">
                    <i class="fas fa-th-large"></i>
                    Dashboard
                </a>
                <a href="/api/info" class="link-item">
                    <i class="fas fa-code"></i>
                    API Info
                </a>
                <a href="/api/info/version" class="link-item">
                    <i class="fas fa-code-branch"></i>
                    Version
                </a>
                <a href="/api/info/features" class="link-item">
                    <i class="fas fa-star"></i>
                    Features
                </a>
                <a href="/api/info/config" class="link-item">
                    <i class="fas fa-cog"></i>
                    Config
                </a>
                <a href="/api/docs" class="link-item">
                    <i class="fas fa-book"></i>
                    Documentation
                </a>
                <a href="/api/docs/list" class="link-item">
                    <i class="fas fa-list"></i>
                    Docs List
                </a>
            </div>
        </div>
    </div>

    <script>
        // Theme toggle functionality
        function toggleTheme() {
            const root = document.documentElement;
            const btn = document.querySelector('.theme-toggle i');
            const currentTheme = localStorage.getItem('theme') || 'auto';
            
            if (currentTheme === 'dark') {
                localStorage.setItem('theme', 'light');
                root.style.colorScheme = 'light';
                btn.className = 'fas fa-moon';
            } else {
                localStorage.setItem('theme', 'dark');
                root.style.colorScheme = 'dark';
                btn.className = 'fas fa-sun';
            }
        }

        // Load saved theme
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const btn = document.querySelector('.theme-toggle i');
            if (savedTheme) {
                document.documentElement.style.colorScheme = savedTheme;
                if (savedTheme === 'dark') {
                    btn.className = 'fas fa-sun';
                }
            }
        })();

        // Load server information
        async function loadServerInfo() {
            try {
                // Try versioned API first, fallback to non-versioned
                let response;
                try {
                    response = await fetch('/api/v1/info');
                    if (!response.ok) throw new Error('Versioned API not found');
                } catch (e) {
                    response = await fetch('/api/info');
                }
                
                const result = await response.json();
                const info = result.data;

                document.getElementById('appName').textContent = info.application.name;
                document.getElementById('appDescription').textContent = info.application.description;

                // Determine environment badge color
                const envColors = {
                    'production': 'var(--success)',
                    'development': 'var(--warning)',
                    'staging': 'var(--info)',
                    'testing': 'var(--accent)'
                };
                const envColor = envColors[info.environment.toLowerCase()] || 'var(--text-secondary)';

                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">
                            <i class="fas fa-circle"></i>
                            Status
                        </div>
                        <div class="stat-value">
                            <span class="status-indicator online"></span>
                            <span style="color: var(--success);">Online</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">
                            <i class="fas fa-tag"></i>
                            Version
                        </div>
                        <div class="stat-value">
                            <i class="fas fa-code-branch" style="color: var(--primary); font-size: 1rem;"></i>
                            ${info.application.version}
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">
                            <i class="fas fa-server"></i>
                            Environment
                        </div>
                        <div class="stat-value" style="color: ${envColor};">
                            <i class="fas fa-circle" style="font-size: 0.5rem;"></i>
                            ${info.environment}
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">
                            <i class="fas fa-cloud"></i>
                            Deployment
                        </div>
                        <div class="stat-value">
                            <i class="fas fa-rocket" style="color: var(--accent); font-size: 1rem;"></i>
                            ${info.deployment.mode}
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Failed to load server info:', error);
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card error-state">
                        <div class="stat-label">
                            <i class="fas fa-exclamation-triangle"></i>
                            Error
                        </div>
                        <div class="stat-value">
                            <i class="fas fa-exclamation-circle"></i>
                            Failed to load data
                        </div>
                    </div>
                `;
            }
        }

        // Load server info on page load
        loadServerInfo();

        // Auto-refresh every 30 seconds
        setInterval(loadServerInfo, 30000);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Press 'r' to refresh
            if (e.key === 'r' && !e.ctrlKey && !e.metaKey) {
                loadServerInfo();
            }
            // Press 'h' for health
            if (e.key === 'h' && !e.ctrlKey && !e.metaKey) {
                window.location.href = '/health';
            }
            // Press 'i' for info
            if (e.key === 'i' && !e.ctrlKey && !e.metaKey) {
                window.location.href = '/info';
            }
            // Press 'd' for docs
            if (e.key === 'd' && !e.ctrlKey && !e.metaKey) {
                window.location.href = '/api/docs';
            }
        });

        // Add visual feedback for refresh
        let refreshTimeout;
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' && !e.ctrlKey && !e.metaKey) {
                const statusIcon = document.querySelector('.status-icon');
                statusIcon.style.animation = 'none';
                setTimeout(() => {
                    statusIcon.style.animation = '';
                }, 10);
            }
        });
    </script>
</body>
</html>
