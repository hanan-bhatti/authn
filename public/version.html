<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version Information</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-elevated: #ffffff;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            
            --border-color: #e2e8f0;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            
            --radius-sm: 6px;
            --radius: 8px;
            --radius-lg: 12px;
            
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0f172a;
                --bg-secondary: #1e293b;
                --bg-tertiary: #334155;
                --bg-elevated: #1e293b;
                
                --text-primary: #f1f5f9;
                --text-secondary: #cbd5e1;
                --text-tertiary: #64748b;
                
                --border-color: #334155;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            background: var(--bg-elevated);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 600px;
            width: 100%;
            padding: 48px 40px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
            border: 1px solid var(--border-color);
            position: relative;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(20px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 1rem;
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
            transform: scale(1.05);
        }

        .version-badge {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            box-shadow: var(--shadow-lg);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            color: var(--text-primary);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .version-number {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 24px 0;
            letter-spacing: -0.03em;
        }

        .info-grid {
            margin-top: 32px;
            display: grid;
            gap: 12px;
        }

        .info-item {
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .info-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow);
        }

        .info-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            text-align: left;
        }

        .info-value {
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 700;
            font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-badge.warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .actions {
            margin-top: 32px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            transform: translateY(-2px);
        }

        .loading {
            padding: 20px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-tertiary);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .footer-link:hover {
            color: var(--primary);
        }

        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .version-number {
                font-size: 2.5rem;
            }

            .version-badge {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
            }

            .container {
                box-shadow: none;
                border: 1px solid #ddd;
            }

            .theme-toggle, .actions {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle dark mode">
            <i class="fas fa-moon"></i>
        </button>

        <div class="version-badge">
            <i class="fas fa-cube"></i>
        </div>
        
        <h1 id="appName">Loading...</h1>
        <p class="subtitle">Application Version Information</p>
        
        <div class="version-number" id="version">
            <div class="spinner"></div>
        </div>

        <div class="info-grid" id="infoGrid" style="display: none;">
            <div class="info-item">
                <div class="info-left">
                    <div class="info-icon">
                        <i class="fas fa-server"></i>
                    </div>
                    <span class="info-label">Environment</span>
                </div>
                <span class="info-value" id="environment">-</span>
            </div>
            
            <div class="info-item">
                <div class="info-left">
                    <div class="info-icon">
                        <i class="fas fa-code-branch"></i>
                    </div>
                    <span class="info-label">API Version</span>
                </div>
                <span class="info-value" id="apiVersion">-</span>
            </div>

            <div class="info-item">
                <div class="info-left">
                    <div class="info-icon">
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <span class="info-label">Status</span>
                </div>
                <span class="status-badge success" id="status">
                    <span class="status-indicator"></span>
                    <span>Operational</span>
                </span>
            </div>
        </div>

        <div class="actions" id="actions" style="display: none;">
            <a href="/info" class="btn btn-primary">
                <i class="fas fa-info-circle"></i>
                Full Information
            </a>
            <a href="/health" class="btn btn-secondary">
                <i class="fas fa-heartbeat"></i>
                Health Check
            </a>
            <a href="/" class="btn btn-secondary">
                <i class="fas fa-home"></i>
                Home
            </a>
        </div>

        <div class="footer" id="footer" style="display: none;">
            <a href="/api/v1/info" class="footer-link">
                <i class="fas fa-code"></i>
                API Info
            </a>
            <a href="/docs" class="footer-link">
                <i class="fas fa-book"></i>
                Documentation
            </a>
        </div>
    </div>

    <script>
        // Theme toggle functionality
        function toggleTheme() {
            const root = document.documentElement;
            const btn = document.querySelector('.theme-toggle i');
            const currentTheme = localStorage.getItem('theme') || 'auto';
            
            if (currentTheme === 'dark') {
                localStorage.setItem('theme', 'light');
                root.style.colorScheme = 'light';
                btn.className = 'fas fa-moon';
            } else {
                localStorage.setItem('theme', 'dark');
                root.style.colorScheme = 'dark';
                btn.className = 'fas fa-sun';
            }
        }

        // Load saved theme
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const btn = document.querySelector('.theme-toggle i');
            if (savedTheme) {
                document.documentElement.style.colorScheme = savedTheme;
                if (savedTheme === 'dark') {
                    btn.className = 'fas fa-sun';
                }
            }
        })();

        // Load version information
        async function loadVersion() {
            try {
                // Try versioned API first
                let response;
                try {
                    response = await fetch('/api/v1/info/version');
                    if (!response.ok) throw new Error('Versioned API not found');
                } catch (e) {
                    response = await fetch('/api/info/version');
                }

                const result = await response.json();
                const data = result.data;

                document.getElementById('appName').textContent = data.name;
                document.getElementById('version').textContent = 'v' + data.version;
                document.getElementById('environment').textContent = data.environment;
                document.getElementById('apiVersion').textContent = data.apiVersion;
                
                // Update status badge based on environment
                const statusBadge = document.getElementById('status');
                if (data.environment === 'production') {
                    statusBadge.className = 'status-badge success';
                    statusBadge.innerHTML = '<span class="status-indicator"></span><span>Production</span>';
                } else if (data.environment === 'development') {
                    statusBadge.className = 'status-badge warning';
                    statusBadge.innerHTML = '<span class="status-indicator"></span><span>Development</span>';
                }

                // Show all sections
                document.getElementById('infoGrid').style.display = 'grid';
                document.getElementById('actions').style.display = 'flex';
                document.getElementById('footer').style.display = 'flex';
                
            } catch (error) {
                document.getElementById('appName').textContent = 'Error Loading Version';
                document.getElementById('version').innerHTML = '<i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>';
                console.error('Failed to load version:', error);
                
                // Show error message
                const infoGrid = document.getElementById('infoGrid');
                infoGrid.style.display = 'grid';
                infoGrid.innerHTML = `
                    <div class="info-item" style="background: rgba(239, 68, 68, 0.1); border-color: var(--danger);">
                        <div class="info-left">
                            <div class="info-icon" style="background: var(--danger);">
                                <i class="fas fa-exclamation-circle"></i>
                            </div>
                            <span class="info-label" style="color: var(--danger);">Error</span>
                        </div>
                        <span class="info-value" style="color: var(--danger);">Failed to load</span>
                    </div>
                `;
                
                document.getElementById('actions').style.display = 'flex';
            }
        }

        // Load version on page load
        loadVersion();

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Press 'h' for home
            if (e.key === 'h' && !e.ctrlKey && !e.metaKey) {
                window.location.href = '/';
            }
            // Press 'i' for info
            if (e.key === 'i' && !e.ctrlKey && !e.metaKey) {
                window.location.href = '/info';
            }
            // Press 'd' for docs
            if (e.key === 'd' && !e.ctrlKey && !e.metaKey) {
                window.location.href = '/docs';
            }
        });
    </script>
</body>
</html>
